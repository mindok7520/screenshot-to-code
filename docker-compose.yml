services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-7001}
      CODEX_HOME: /codex-home
      CODEX_AUTH_CALLBACK_BIND_HOST: 0.0.0.0
    ports:
      - "${BACKEND_PORT:-7001}:${BACKEND_PORT:-7001}"
      - "1455:1455"
      - "1457:1457"
    volumes:
      - codex-home:/codex-home

    command: >
      poetry run uvicorn main:app
      --host 0.0.0.0
      --port ${BACKEND_PORT:-7001}
      --ws-ping-interval ${WS_PING_INTERVAL:-30}
      --ws-ping-timeout ${WS_PING_TIMEOUT:-180}

  backend-checks:
    profiles: ["checks"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV_DEPS: "true"
    environment:
      CODEX_HOME: /codex-home
    volumes:
      - codex-home:/codex-home
    command: >
      sh -lc "poetry run pytest && poetry run pyright"
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_HTTP_BACKEND_URL: ${VITE_HTTP_BACKEND_URL:-http://127.0.0.1:7001}
      VITE_WS_BACKEND_URL: ${VITE_WS_BACKEND_URL:-ws://127.0.0.1:7001}
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  codex-home:
